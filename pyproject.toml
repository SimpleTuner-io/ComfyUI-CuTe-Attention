[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-cute-attention"
version = "0.1.0"
description = "ComfyUI attention override using vendored KohakuFA-CuTe kernels"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
dependencies = ["torch>=2.11", "packaging>=23"]

[project.optional-dependencies]
cuda = [
    "nvidia-cutlass-dsl>=4.8,<4.9",
    "apache-tvm-ffi>=0.1.14,<0.2",
    "ninja>=1.11",
    "triton>=3.6,<4",
]

sm80-fa4 = [
    "torch==2.15.0",
    "nvidia-cutlass-dsl==4.8.1",
    "apache-tvm-ffi==0.1.15.post0",
    "quack-kernels==0.6.5",
    "torch-c-dlpack-ext==0.1.5",
    "flash-attn-4[cu13] @ git+https://github.com/Dao-AILab/flash-attention.git@4616f5116d33e3ba3cbb71d582caffcfcb49649c#subdirectory=flash_attn/cute",
]
hopper-fa4 = [
    "torch==2.15.0",
    "nvidia-cutlass-dsl==4.8.1",
    "apache-tvm-ffi==0.1.15.post0",
    "quack-kernels==0.6.5",
    "torch-c-dlpack-ext==0.1.5",
    "flash-attn-4[cu13] @ git+https://github.com/Dao-AILab/flash-attention.git@4616f5116d33e3ba3cbb71d582caffcfcb49649c#subdirectory=flash_attn/cute",
]

[tool.setuptools.packages.find]
include = ["cute_attention*"]

[tool.setuptools.package-data]
"cute_attention.vendor.kohakufa_cute" = ["native.cpp", "py.typed"]

[tool.black]
line-length = 110
target-version = ["py312", "py313"]
